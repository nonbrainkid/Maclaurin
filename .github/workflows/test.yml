name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  slither:
    name: Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      # Slither компилирует проект через forge, поэтому Foundry нужен и здесь.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Версия зафиксирована намеренно: новый детектор в свежем релизе не должен
      # внезапно ронять CI на неизменившемся коде. Обновляется осознанно.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      # Настройки и обоснование исключений — в slither.config.json и README
      # (раздел "Slither"). Конфиг подхватывается автоматически из корня репозитория.
      # fail_on: low, поэтому любая новая находка уронит job.
      - name: Run Slither
        run: slither .
